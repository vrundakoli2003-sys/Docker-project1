services:
  mysql:
    image: mysql:8.4
    container_name: opsmate-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: opsmate
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - opsmate-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsmate-app
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: opsmate
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - opsmate-network
    restart: unless-stopped

networks:
  opsmate-network:
    driver: bridge

volumes:
  mysql-data:
